services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-language_learning_hub}
    ports:
      # Host-only: reachable by local tools, not from the LAN/Tailscale.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-language_learning_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-language_learning_hub}}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_JSON_MAX_RETRIES: ${AI_JSON_MAX_RETRIES:-2}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-1000000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      # Default: Ollama installed on the host. Use http://ollama:11434 with the "offline" profile instead.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      TTS_PROVIDER: ${TTS_PROVIDER:-piper}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-3.8-flash-lite-tts}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-a2-deutsch-hub-backend}
    ports:
      # Host-only: other devices reach the API through the frontend's /api proxy.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      # Lets the container reach services on the host (e.g. Ollama) on Linux too; built in on Docker Desktop.
      - "host.docker.internal:host-gateway"
    volumes:
      # Generated Hören audio (served at /api/v1/media).
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      # All interfaces, so phones/laptops on the tailnet can open http://<this-pc-tailscale-ip>:5173
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

  # Self-hosted LLM observability: agent traces, prompts, tool calls, token usage.
  # UI at http://localhost:6006; the backend exports OTLP traces to it over HTTP.
  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
    volumes:
      - phoenix_data:/mnt/data

  ollama:
    image: ollama/ollama:latest
    profiles: ["offline"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  media_data:
  ollama_data:
  phoenix_data:
