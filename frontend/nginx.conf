# WebSocket upgrades (Sprechen live sessions) pass through the /api proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA calls the API on its own origin (/api/v1/...), so it works from any address it is
    # opened on (localhost, the Tailscale IP, a MagicDNS name) with no CORS and no rebuild.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Uploads: backend allows MAX_UPLOAD_BYTES (10 MB by default); nginx's own default is 1 MB.
        client_max_body_size 12m;
        # Long enough for a live Sprechen conversation (the backend caps sessions itself).
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
